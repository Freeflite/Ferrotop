[package]
name = "ferrotop-core"
description = "Process provider, CPU accounting and process-tree logic for Ferrotop. Contains no unsafe code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
