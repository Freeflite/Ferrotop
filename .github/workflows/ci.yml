# Every push and pull request: format, lint, test, supply-chain policy, Miri and a short fuzz run.
# Tags (v*): a hardened, reproducible release build with a signed build-provenance attestation,
# published as a GitHub release. Run it by hand (Actions → CI → Run workflow) for a dry run that
# builds and packages the release without publishing it.
#
# Third-party actions are pinned to full commit SHAs (the comment says which release), so a
# moved tag can't change what runs here.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so new RustSec advisories against existing dependencies are noticed.
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Format, lint, test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  deny:
    name: Advisories, licenses, sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  miri:
    name: Miri (unsafe buffer helpers and pure parsers)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal --component miri,rust-src
      - run: cargo +nightly miri setup
      # Only tests that don't call into Windows (Miri can't execute foreign functions).
      - name: Run the pure tests under Miri
        run: |
          cargo +nightly miri test -p ferrotop-sys --lib -- buffer:: never_panic rejects_counts decodes_ parses_ maps_ requests_ ioctl_
        env:
          MIRIFLAGS: -Zmiri-strict-provenance

  fuzz:
    name: Fuzz (60 s per target)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - name: Run each target
        shell: pwsh
        run: |
          # The AddressSanitizer runtime DLL ships with Visual Studio's MSVC tools.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $asan = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\clang_rt.asan_dynamic-x86_64.dll" | Select-Object -First 1
          $env:PATH = "$($asan.DirectoryName);$env:PATH"
          foreach ($target in 'sys_buffers', 'json', 'lhm_response', 'archive') {
            cargo +nightly fuzz run --fuzz-dir fuzz $target -- -max_total_time=60
            if ($LASTEXITCODE -ne 0) { throw "fuzz target $target failed" }
          }

  service:
    name: History service end to end
    needs: [test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo build --release --locked
      - run: cargo build --release --locked -p ferrotop-core --example history_check
      # The runner is a throwaway VM with administrator rights, so the service can really be
      # installed, checked from the outside, and removed.
      - name: Install, check and remove the service
        shell: pwsh
        run: |
          $exe = (Resolve-Path target/release/ferrotop.exe).Path
          $install = Start-Process -FilePath $exe -ArgumentList '--install-service' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "install failed with exit code $($install.ExitCode)" }
          $service = Get-Service Ferrotop
          if ($service.Status -ne 'Running') { throw "the service is $($service.Status)" }
          $config = Get-CimInstance Win32_Service -Filter "Name='Ferrotop'"
          "runs: $($config.PathName) as $($config.StartName)"
          if ($config.PathName -notlike '*Program Files*Ferrotop*ferrotop.exe*') { throw 'the service should run from Program Files' }
          $data = Join-Path $env:ProgramData 'Ferrotop'
          $owner = (Get-Acl $data).Owner
          "data folder owner: $owner"
          if ($owner -notmatch 'Administrators|SYSTEM') { throw "the data folder is owned by $owner" }
          Start-Sleep -Seconds 15
          & ./target/release/examples/history_check.exe
          if ($LASTEXITCODE -ne 0) { throw 'history check failed' }
          $uninstall = Start-Process -FilePath $exe -ArgumentList '--uninstall-service' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "uninstall failed with exit code $($uninstall.ExitCode)" }
          if (Get-Service Ferrotop -ErrorAction SilentlyContinue) { throw 'the service is still installed' }
          if (Test-Path (Join-Path $env:ProgramFiles 'Ferrotop/ferrotop.exe')) { throw 'the Program Files copy is still there' }
          if (-not (Get-ChildItem $data -Filter *.seconds)) { throw 'the history should be kept' }
          'installed, recorded, published and removed'

  release:
    name: Release build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [test, deny, miri, fuzz, service]
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Build, check mitigations, verify reproducibility
        shell: pwsh
        run: ./scripts/build-release.ps1 -Verify
      - name: Package the exe, its licenses and checksums
        shell: pwsh
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: ./scripts/package-release.ps1 -Tag $env:TAG
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/ferrotop.exe
            dist/*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  # Only this job may write to the repository, and only for tags; the build above never can.
  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/$TAG.md"
          test -f "$notes" || { echo "Missing release notes: $notes"; exit 1; }
          (cd dist && sha256sum -c SHA256SUMS.txt)
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Ferrotop ${TAG#v}" --notes-file "$notes" --verify-tag
